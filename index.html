<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メンテナンス中｜光鯖公式</title>
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      /* 画像に合わせた温かみのある背景色 */
      --bg: #fdfaf0; 
      --text: #333333;
      --primary: #FFA500;
    }
    body {
      margin: 0;
      font-family: 'M PLUS 2', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      /* 画面の中央に配置するための設定 */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    .container {
      width: 100%;
      max-width: 700px; /* 画像に合わせてコンテナ幅を少し広めに設定 */
      background: #ffffff; /* 白背景 */
      padding: 4rem 3rem; /* 上下の余白を多めに */
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.03); /* 自然で柔らかい影 */
      box-sizing: border-box;
    }
    h1 {
      font-family: 'Outfit', 'M PLUS 2', sans-serif;
      font-weight: 800;
      color: var(--primary);
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-size: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    p {
      line-height: 1.8;
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
      color: #4a4a4a;
    }
    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      align-items: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      padding: 1.2rem 2rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.05rem;
      transition: all 0.3s ease;
      width: 100%;
      max-width: 400px; /* ボタンの幅を画像に合わせて広めに */
      box-sizing: border-box;
    }
    .btn-mail {
      background: #ffffff;
      color: var(--text);
      border: 1px solid #dcdcdc;
    }
    .btn-mail:hover {
      background: #f8f8f8;
      transform: translateY(-2px);
    }
    .btn-discord {
      background: #5865F2;
      color: #ffffff;
      border: none;
    }
    .btn-discord:hover {
      background: #4752C4;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
    }

    /* レスポンシブ対応：画面幅が600px以下（スマホなど）の場合のスタイル */
    @media (max-width: 600px) {
      .container {
        padding: 2.5rem 1.5rem;
        border-radius: 16px;
      }
      h1 {
        font-size: 2.2rem;
      }
      p {
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }
      .btn {
        padding: 1rem 1.5rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fa-solid fa-server"></i> 503</h1>
    <p>
      現在、サーバーにアクセスできない状況になっています。<br>
      もし、これが続くようであれば、以下の方法で運営へお問い合わせをお願いします。
    </p>
    <div class="contact-links">
      <a href="mailto:server@hikariserver.com" class="btn btn-mail">
        <i class="fa-regular fa-envelope"></i> server@hikariserver.com
      </a>
      <a href="https://discord.hikariserver.com" class="btn btn-discord" target="_blank" rel="noopener">
        <i class="fa-brands fa-discord"></i> Discordに参加
      </a>
    </div>
  </div>
</body>
</html>
